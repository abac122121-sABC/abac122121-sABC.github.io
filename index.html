<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹坦克 · 联机对战</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='10' width='20' height='14' rx='3' fill='%2322d3ee'/%3E%3Crect x='13' y='4' width='6' height='10' fill='%2322d3ee'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0b0e1a;
    --panel:#141930;
    --line:#2a3358;
    --cyan:#22d3ee;
    --orange:#fb923c;
    --txt:#e2e8f0;
    --dim:#8b95b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #1a2140 0%, var(--bg) 60%);
    color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

  /* ---------- 通用面板 ---------- */
  .screen{display:none;width:min(92vw,420px);text-align:center}
  .screen.active{display:block}
  h1{
    font-size:42px;letter-spacing:6px;font-weight:900;
    background:linear-gradient(90deg,var(--cyan),#a5f3fc 50%,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  .sub{color:var(--dim);font-size:14px;margin-bottom:32px;letter-spacing:1px}
  .btn{
    display:block;width:100%;padding:15px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px;letter-spacing:2px;
    border-radius:12px;cursor:pointer;margin-bottom:12px;transition:.15s;font-family:inherit;
  }
  .btn.primary{background:linear-gradient(135deg,#0891b2,#06b6d4);border-color:transparent;color:#04121a;font-weight:700}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .room-code{
    font-size:40px;letter-spacing:10px;font-weight:800;color:var(--cyan);
    padding:18px;border:1px dashed var(--line);border-radius:12px;margin:14px 0;
    font-family:"SF Mono",Consolas,monospace;text-shadow:0 0 18px rgba(34,211,238,.6);
  }
  input{
    width:100%;padding:14px;background:#0d1226;border:1px solid var(--line);
    border-radius:12px;color:var(--txt);font-size:22px;letter-spacing:8px;text-align:center;
    text-transform:uppercase;font-family:"SF Mono",Consolas,monospace;margin-bottom:12px;outline:none;
  }
  input:focus{border-color:var(--cyan)}
  .tip{color:var(--dim);font-size:12px;line-height:1.7;margin-top:18px}
  .err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}
  .status{color:var(--cyan);font-size:13px;margin-top:14px;min-height:18px}

  /* ---------- 游戏 ---------- */
  #gameWrap{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center}
  #gameWrap.active{display:flex}
  #hud{
    width:min(96vw,960px);display:flex;justify-content:space-between;align-items:center;
    padding:8px 4px;font-size:14px;letter-spacing:1px;
  }
  .score{font-family:"SF Mono",Consolas,monospace;font-size:26px;font-weight:800}
  .score.p1{color:var(--cyan)} .score.p2{color:var(--orange)}
  .who{color:var(--dim);font-size:12px}
  canvas{
    width:min(96vw,960px);
    aspect-ratio:8/5;
    background:#0a0d1a;
    border:1px solid var(--line);
    border-radius:10px;
    display:block;touch-action:none;
  }

  /* 触屏按钮 */
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:10}
  body.touch #touch{display:block}
  .tbtn{
    position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;
    background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.5);color:var(--cyan);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
  }
  .tbtn.fire{background:rgba(251,146,60,.18);border-color:rgba(251,146,60,.6);color:var(--orange);width:78px;height:78px}
  #tLeft{left:20px;bottom:30px} #tRight{left:100px;bottom:30px}
  #tFwd{left:60px;bottom:110px}
  #tFire{right:24px;bottom:40px}
</style>
</head>
<body>
<div id="app">

  <!-- 主菜单 -->
  <div class="screen active" id="scrMenu">
    <h1>霓虹坦克</h1>
    <div class="sub">NEON TANK · 双人联机对战</div>
    <button class="btn primary" id="btnCreate">创建房间</button>
    <button class="btn" id="btnJoin">加入房间</button>
    <div class="tip">两人各开一个本页面<br>一个建房，一个输入房间码加入<br>键盘 WASD 移动 · 空格 开火 · 先得 5 分获胜</div>
  </div>

  <!-- 建房等待 -->
  <div class="screen" id="scrHost">
    <h1 style="font-size:28px">房间已创建</h1>
    <div class="sub">把下面的房间码发给朋友</div>
    <div class="room-code" id="roomCode">----</div>
    <div class="status" id="hostStatus">等待对方加入…</div>
    <div class="err" id="hostErr"></div>
    <button class="btn" id="btnCancelHost" style="margin-top:24px">取消</button>
  </div>

  <!-- 加入房间 -->
  <div class="screen" id="scrJoin">
    <h1 style="font-size:28px">加入房间</h1>
    <div class="sub">输入对方给你的房间码</div>
    <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off">
    <button class="btn primary" id="btnDoJoin">加入</button>
    <button class="btn" id="btnBack">返回</button>
    <div class="err" id="joinErr"></div>
    <div class="status" id="joinStatus"></div>
  </div>

  <!-- 结算 -->
  <div class="screen" id="scrOver">
    <h1 id="overTitle">胜利</h1>
    <div class="sub" id="overSub"></div>
    <button class="btn primary" id="btnAgain">再来一局</button>
    <button class="btn" id="btnLeave">离开房间</button>
  </div>

</div>

<!-- 游戏区 -->
<div id="gameWrap">
  <div id="hud">
    <span class="who" id="hudRole">你</span>
    <span><span class="score p1" id="s1">0</span> : <span class="score p2" id="s2">0</span></span>
    <span class="who" id="hudOpp">对手</span>
  </div>
  <canvas id="cv"></canvas>
</div>

<!-- 触屏控件 -->
<div id="touch">
  <div class="tbtn" id="tLeft">&#8634;</div>
  <div class="tbtn" id="tFwd">&#9650;</div>
  <div class="tbtn" id="tRight">&#8635;</div>
  <div class="tbtn fire" id="tFire">弹</div>
</div>

<script>
/* ================= 常量 ================= */
const W = 960, H = 600;
const TANK_R = 16;
const SPEED = 2.6;
const TURN = 0.055;
const BULLET_SPEED = 7;
const FIRE_CD = 480;
const WIN_SCORE = 5;
const WALLS = [
  {x:170,y:110,w:36,h:170},
  {x:170,y:320,w:36,h:170},
  {x:754,y:110,w:36,h:170},
  {x:754,y:320,w:36,h:170},
  {x:450,y:262,w:60,h:76},
];
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const scr = {menu:$('scrMenu'),host:$('scrHost'),join:$('scrJoin'),over:$('scrOver')};
const gameWrap = $('gameWrap');
const cv = $('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function show(name){
  Object.values(scr).forEach(s=>s.classList.remove('active'));
  gameWrap.classList.remove('active');
  if(name && scr[name]) scr[name].classList.add('active');
  if(name==='game') gameWrap.classList.add('active');
}

/* 触屏检测 */
if('ontouchstart' in window || navigator.maxTouchPoints>0){
  document.body.classList.add('touch');
}

/* ================= 输入 ================= */
const keys = {up:false,down:false,left:false,right:false,fire:false};
const keyMap = {
  KeyW:'up', ArrowUp:'up',
  KeyS:'down', ArrowDown:'down',
  KeyA:'left', ArrowLeft:'left',
  KeyD:'right', ArrowRight:'right',
  Space:'fire'
};
window.addEventListener('keydown', e=>{
  const k = keyMap[e.code];
  if(k){ keys[k]=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{
  const k = keyMap[e.code];
  if(k) keys[k]=false;
});
// 触屏按钮
function bindBtn(id, prop){
  const el = $(id);
  const on = e=>{ e.preventDefault(); keys[prop]=true; };
  const off = e=>{ e.preventDefault(); keys[prop]=false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindBtn('tLeft','left'); bindBtn('tRight','right');
bindBtn('tFwd','up'); bindBtn('tFire','fire');

/* ================= 联机状态 ================= */
let peer=null, conn=null, role=null; // role: 'host' | 'guest'
let guestKeys = {up:false,down:false,left:false,right:false,fire:false};
let remoteState = null; // guest 渲染用

function genCode(){
  let s='';
  for(let i=0;i<4;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
function cleanup(){
  if(conn){ try{conn.close();}catch(e){} }
  if(peer){ try{peer.destroy();}catch(e){} }
  conn=null; peer=null; role=null;
  G=null; remoteState=null;
}

/* ---------- 创建房间 ---------- */
$('btnCreate').onclick = ()=>{
  show('host');
  $('hostErr').textContent='';
  $('hostStatus').textContent='正在创建房间…';
  const code = genCode();
  $('roomCode').textContent = code;
  const myId = 'tankbattle-'+code.toLowerCase();
  try{
    peer = new Peer(myId, {debug:0});
  }catch(e){
    $('hostErr').textContent = '网络组件加载失败，请检查网络后刷新';
    return;
  }
  peer.on('open', ()=>{
    $('hostStatus').textContent = '房间已就绪，等待对方加入…';
  });
  peer.on('connection', c=>{
    conn = c;
    conn.on('open', ()=>{
      $('hostStatus').textContent = '对方已加入，游戏开始！';
      startAsHost();
    });
    conn.on('data', d=>{
      if(d && d.t==='i'){
        guestKeys = {up:!!d.up, down:!!d.down, left:!!d.left, right:!!d.right, fire:!!d.fire};
      }
    });
    conn.on('close', ()=> onPeerLeave('对方已离开房间'));
    conn.on('error', ()=> onPeerLeave('连接断开'));
  });
  peer.on('error', err=>{
    if(err.type==='unavailable-id'){
      $('hostErr').textContent='房间码被占用，请重试（刷新页面重建）';
    }else if(err.type==='network'||err.type==='server-unavailable'){
      $('hostErr').textContent='联机服务器连接失败，请检查网络';
    }else{
      $('hostErr').textContent='连接错误：'+err.type;
    }
  });
};
$('btnCancelHost').onclick = ()=>{ cleanup(); show('menu'); };

/* ---------- 加入房间 ---------- */
$('btnJoin').onclick = ()=>{ show('join'); $('codeInput').focus(); };
$('btnBack').onclick = ()=>{ cleanup(); show('menu'); };
$('btnDoJoin').onclick = ()=>{
  const code = $('codeInput').value.trim().toUpperCase();
  $('joinErr').textContent='';
  $('joinStatus').textContent='正在连接…';
  if(code.length!==4){ $('joinErr').textContent='请输入 4 位房间码'; return; }
  try{
    peer = new Peer({debug:0});
  }catch(e){
    $('joinErr').textContent='网络组件加载失败，请刷新重试'; return;
  }
  peer.on('open', ()=>{
    conn = peer.connect('tankbattle-'+code.toLowerCase(), {reliable:true});
    conn.on('open', ()=>{
      $('joinStatus').textContent='已连接，等待房主开始…';
      role='guest';
    });
    conn.on('data', d=>{
      if(!d) return;
      if(d.t==='go'){ startAsGuest(); }
      else if(d.t==='s'){ remoteState = d; }
      else if(d.t==='over'){ onGameOver(d.w); }
      else if(d.t==='again'){ startAsHost(); }
    });
    conn.on('close', ()=> onPeerLeave('房主已离开房间'));
    conn.on('error', ()=> onPeerLeave('连接失败，房间码可能有误'));
  });
  peer.on('error', err=>{
    if(err.type==='peer-unavailable') $('joinErr').textContent='找不到该房间，请核对房间码';
    else if(err.type==='network') $('joinErr').textContent='网络连接失败';
    else $('joinErr').textContent='错误：'+err.type;
    $('joinStatus').textContent='';
  });
};

function roleAsIdx(){ return role==='host'?0:1; }

function onPeerLeave(msg){
  alert(msg);
  cleanup();
  show('menu');
}

/* ================= 游戏逻辑（host 权威） ================= */
let G = null;
function newGame(){
  G = {
    p1:{x:120, y:H/2, angle:0, cd:0},
    p2:{x:W-120, y:H/2, angle:Math.PI, cd:0},
    bullets:[],
    score:[0,0],
    over:false,
    overSent:false
  };
}
function respawn(idx){
  const t = idx===0?G.p1:G.p2;
  t.x = idx===0?120:W-120;
  t.y = H/2;
  t.angle = idx===0?0:Math.PI;
  t.cd = 0;
}
function rectHit(r, x, y, rad){
  const cx = Math.max(r.x, Math.min(x, r.x+r.w));
  const cy = Math.max(r.y, Math.min(y, r.y+r.h));
  const dx=x-cx, dy=y-cy;
  return dx*dx+dy*dy < rad*rad;
}
function moveTank(t, inp, dt){
  if(inp.left) t.angle -= TURN;
  if(inp.right) t.angle += TURN;
  let vx=0, vy=0;
  if(inp.up){ vx += Math.cos(t.angle)*SPEED; vy += Math.sin(t.angle)*SPEED; }
  if(inp.down){ vx -= Math.cos(t.angle)*SPEED*0.6; vy -= Math.sin(t.angle)*SPEED*0.6; }
  const nx = t.x+vx, ny = t.y+vy;
  let okX = nx>TANK_R && nx<W-TANK_R;
  let okY = ny>TANK_R && ny<H-TANK_R;
  for(const w of WALLS){
    if(rectHit(w,nx,t.y,TANK_R-2)) okX=false;
    if(rectHit(w,t.x,ny,TANK_R-2)) okY=false;
  }
  if(okX) t.x=nx;
  if(okY) t.y=ny;
  if(inp.fire && t.cd<=0){
    G.bullets.push({x:t.x+Math.cos(t.angle)*(TANK_R+4), y:t.y+Math.sin(t.angle)*(TANK_R+4), a:t.angle});
    t.cd = FIRE_CD;
  }
  if(t.cd>0) t.cd -= dt;
}
function updateBullets(){
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.x += Math.cos(b.a)*BULLET_SPEED;
    b.y += Math.sin(b.a)*BULLET_SPEED;
    let dead = b.x<0||b.x>W||b.y<0||b.y>H;
    for(const w of WALLS){
      if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){ dead=true; break; }
    }
    if(!dead){
      const targets=[G.p1,G.p2];
      for(let ti=0;ti<2;ti++){
        const t=targets[ti];
        const dx=b.x-t.x, dy=b.y-t.y;
        if(dx*dx+dy*dy < TANK_R*TANK_R){
          G.score[ti]++;
          respawn(ti);
          dead=true;
          if(G.score[ti]>=WIN_SCORE && !G.over){
            G.over=true; G.winner=ti;
          }
          break;
        }
      }
    }
    if(dead) G.bullets.splice(i,1);
  }
}

/* ================= 开始 / 结束 ================= */
function startAsHost(){
  role='host';
  newGame();
  show('game');
  $('hudRole').textContent='你（青）';
  $('hudOpp').textContent='对手（橙）';
  conn.send({t:'go'});
}
function startAsGuest(){
  show('game');
  $('hudRole').textContent='你（橙）';
  $('hudOpp').textContent='对手（青）';
}
function onGameOver(winner){
  G = null; remoteState = null;
  const me = roleAsIdx();
  show('over');
  if(winner===me){
    $('overTitle').textContent='胜 利';
    $('overTitle').style.color='#4ade80';
    $('overSub').textContent='你拿下了这一局';
  }else{
    $('overTitle').textContent='败 北';
    $('overTitle').style.color='#f87171';
    $('overSub').textContent='再接再厉，下局赢回来';
  }
}
$('btnAgain').onclick = ()=>{
  if(role==='host'){
    startAsHost();
  }else{
    if(conn&&conn.open) conn.send({t:'again'});
    show('game');
  }
};
$('btnLeave').onclick = ()=>{ cleanup(); show('menu'); };

/* ================= 渲染 ================= */
function drawTank(x,y,angle,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  // 车身
  ctx.fillStyle=color;
  ctx.shadowColor=color; ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.roundRect(-TANK_R,-TANK_R*0.8, TANK_R*2, TANK_R*1.6, 4);
  ctx.fill();
  ctx.shadowBlur=0;
  // 炮管
  ctx.fillStyle=color;
  ctx.fillRect(TANK_R-2, -3, TANK_R+8, 6);
  ctx.restore();
}
function render(){
  ctx.fillStyle='#0a0d1a';
  ctx.fillRect(0,0,W,H);
  // 网格
  ctx.strokeStyle='rgba(60,80,140,.18)';
  ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // 墙
  ctx.fillStyle='#2a3358';
  for(const w of WALLS){ ctx.fillRect(w.x,w.y,w.w,w.h); }
  // 坦克与子弹
  if(role==='host' && G){
    drawTank(G.p1.x,G.p1.y,G.p1.angle,'#22d3ee');
    drawTank(G.p2.x,G.p2.y,G.p2.angle,'#fb923c');
    for(const b of G.bullets){
      ctx.fillStyle='#fde68a';
      ctx.shadowColor='#fde68a'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(b.x,b.y,3.5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    $('s1').textContent=G.score[0];
    $('s2').textContent=G.score[1];
  }else if(role==='guest' && remoteState){
    drawTank(remoteState.p1.x,remoteState.p1.y,remoteState.p1.a,'#22d3ee');
    drawTank(remoteState.p2.x,remoteState.p2.y,remoteState.p2.a,'#fb923c');
    for(const b of remoteState.b){
      ctx.fillStyle='#fde68a';
      ctx.shadowColor='#fde68a'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(b.x,b.y,3.5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    $('s1').textContent=remoteState.s[0];
    $('s2').textContent=remoteState.s[1];
  }
}

/* ================= 主循环 ================= */
let last=performance.now(), lastSend=0;
function loop(now){
  const dt = Math.min(now-last, 50);
  last=now;
  if(role==='host' && G){
    if(!G.over){
      moveTank(G.p1, keys, dt);
      moveTank(G.p2, guestKeys, dt);
      updateBullets();
    }else if(G.over && !G.overSent){
      G.overSent = true;
      if(conn&&conn.open){ conn.send({t:'over', w:G.winner}); }
      onGameOver(G.winner);
    }
    // 广播状态
    if(conn && conn.open && now-lastSend>=66){
      lastSend=now;
      conn.send({
        t:'s',
        p1:{x:G.p1.x,y:G.p1.y,a:G.p1.angle},
        p2:{x:G.p2.x,y:G.p2.y,a:G.p2.angle},
        b:G.bullets.map(b=>({x:b.x,y:b.y})),
        s:G.score
      });
    }
  }
  if(role==='guest' && conn && conn.open){
    conn.send({t:'i', up:keys.up, down:keys.down, left:keys.left, right:keys.right, fire:keys.fire});
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
