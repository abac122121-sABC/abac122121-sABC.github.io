<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹贪吃蛇 · 联机对战</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='14' width='24' height='5' rx='2' fill='%2322d3ee'/%3E%3Ccircle cx='10' cy='11' r='4' fill='%2322d3ee'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0b0e1a; --panel:#141930; --line:#2a3358;
    --cyan:#22d3ee; --orange:#fb923c; --txt:#e2e8f0; --dim:#8b95b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #1a2140 0%, var(--bg) 60%);
    color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden; user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .screen{display:none;width:min(92vw,420px);text-align:center}
  .screen.active{display:block}
  h1{
    font-size:40px;letter-spacing:6px;font-weight:900;
    background:linear-gradient(90deg,var(--cyan),#a5f3fc 50%,var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;
  }
  .sub{color:var(--dim);font-size:14px;margin-bottom:30px;letter-spacing:1px}
  .btn{
    display:block;width:100%;padding:15px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px;letter-spacing:2px;
    border-radius:12px;cursor:pointer;margin-bottom:12px;transition:.15s;font-family:inherit;
  }
  .btn.primary{background:linear-gradient(135deg,#0891b2,#06b6d4);border-color:transparent;color:#04121a;font-weight:700}
  .btn:active{transform:scale(.97)}
  .room-code{
    font-size:40px;letter-spacing:10px;font-weight:800;color:var(--cyan);
    padding:18px;border:1px dashed var(--line);border-radius:12px;margin:14px 0;
    font-family:"SF Mono",Consolas,monospace;text-shadow:0 0 18px rgba(34,211,238,.6);
  }
  input{
    width:100%;padding:14px;background:#0d1226;border:1px solid var(--line);
    border-radius:12px;color:var(--txt);font-size:22px;letter-spacing:8px;text-align:center;
    text-transform:uppercase;font-family:"SF Mono",Consolas,monospace;margin-bottom:12px;outline:none;
  }
  input:focus{border-color:var(--cyan)}
  .tip{color:var(--dim);font-size:12px;line-height:1.7;margin-top:18px}
  .err{color:#f87171;font-size:13px;min-height:18px;margin-top:8px}
  .status{color:var(--cyan);font-size:13px;margin-top:14px;min-height:18px}

  #gameWrap{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center}
  #gameWrap.active{display:flex}
  #hud{
    width:min(94vw,576px);display:flex;justify-content:space-between;align-items:center;
    padding:6px 4px;font-size:14px;letter-spacing:1px;
  }
  .score{font-family:"SF Mono",Consolas,monospace;font-size:26px;font-weight:800}
  .score.p1{color:var(--cyan)} .score.p2{color:var(--orange)}
  .who{color:var(--dim);font-size:12px}
  canvas{
    width:min(94vw,576px);aspect-ratio:1;
    background:#0a0d1a;border:1px solid var(--line);border-radius:10px;display:block;touch-action:none;
  }
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:10}
  body.touch #touch{display:block}
  .tbtn{
    position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;
    background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.5);color:var(--cyan);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  }
  #tUp{left:50%;transform:translateX(-50%);bottom:190px}
  #tLeft{left:calc(50% - 70px);bottom:120px}
  #tDown{left:50%;transform:translateX(-50%);bottom:120px}
  #tRight{left:calc(50% + 10px);bottom:120px}
</style>
</head>
<body>
<div id="app">
  <div class="screen active" id="scrMenu">
    <h1>霓虹贪吃蛇</h1>
    <div class="sub">NEON SNAKE · 双人联机对战</div>
    <button class="btn primary" id="btnCreate">创建房间</button>
    <button class="btn" id="btnJoin">加入房间</button>
    <div class="tip">两人各开一个本页面<br>方向键 / WASD 控制方向<br>先吃 5 颗果实获胜，撞墙或撞蛇身就输</div>
  </div>
  <div class="screen" id="scrHost">
    <h1 style="font-size:28px">房间已创建</h1>
    <div class="sub">把下面的房间码发给朋友</div>
    <div class="room-code" id="roomCode">----</div>
    <div class="status" id="hostStatus">等待对方加入…</div>
    <div class="err" id="hostErr"></div>
    <button class="btn" id="btnCancelHost" style="margin-top:24px">取消</button>
  </div>
  <div class="screen" id="scrJoin">
    <h1 style="font-size:28px">加入房间</h1>
    <div class="sub">输入对方给你的房间码</div>
    <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off">
    <button class="btn primary" id="btnDoJoin">加入</button>
    <button class="btn" id="btnBack">返回</button>
    <div class="err" id="joinErr"></div>
    <div class="status" id="joinStatus"></div>
  </div>
  <div class="screen" id="scrOver">
    <h1 id="overTitle">胜利</h1>
    <div class="sub" id="overSub"></div>
    <button class="btn primary" id="btnAgain">再来一局</button>
    <button class="btn" id="btnLeave">离开房间</button>
  </div>
</div>

<div id="gameWrap">
  <div id="hud">
    <span class="who" id="hudRole">你</span>
    <span><span class="score p1" id="s1">0</span> : <span class="score p2" id="s2">0</span></span>
    <span class="who" id="hudOpp">对手</span>
  </div>
  <canvas id="cv"></canvas>
</div>

<div id="touch">
  <div class="tbtn" id="tUp">&#9650;</div>
  <div class="tbtn" id="tLeft">&#9664;</div>
  <div class="tbtn" id="tDown">&#9660;</div>
  <div class="tbtn" id="tRight">&#9654;</div>
</div>

<script>
const $ = id => document.getElementById(id);
const scr = {menu:$('scrMenu'),host:$('scrHost'),join:$('scrJoin'),over:$('scrOver')};
const gameWrap = $('gameWrap');
function show(name){
  Object.values(scr).forEach(s=>s.classList.remove('active'));
  gameWrap.classList.remove('active');
  if(name && scr[name]) scr[name].classList.add('active');
  if(name==='game') gameWrap.classList.add('active');
}

if('ontouchstart' in window || navigator.maxTouchPoints>0) document.body.classList.add('touch');

/* ===== 游戏常量 ===== */
const GRID = 24;
const CELL = 24;
const SIZE = GRID * CELL;
const TICK = 130;       // 每步毫秒
const WIN_SCORE = 5;
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

const cv = $('cv'), ctx = cv.getContext('2d');
cv.width = SIZE; cv.height = SIZE;

/* ===== 输入 ===== */
let pendingDir = {host:null, guest:null}; // 本 tick 内的方向队列
const keyDir = {
  ArrowUp:{x:0,y:-1}, KeyW:{x:0,y:-1},
  ArrowDown:{x:0,y:1}, KeyS:{x:0,y:1},
  ArrowLeft:{x:-1,y:0}, KeyA:{x:-1,y:0},
  ArrowRight:{x:1,y:0}, KeyD:{x:1,y:0}
};
window.addEventListener('keydown', e=>{
  const d = keyDir[e.code];
  if(d){
    e.preventDefault();
    pendingDir.me = d;
  }
});
function bindDir(id, d){
  const el = $(id);
  const on = e=>{ e.preventDefault(); pendingDir.me = d; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('mousedown', on);
}
bindDir('tUp',{x:0,y:-1}); bindDir('tDown',{x:0,y:1});
bindDir('tLeft',{x:-1,y:0}); bindDir('tRight',{x:1,y:0});

/* ===== 联机 ===== */
let peer=null, conn=null, role=null;
let guestDir = null;
let remoteState = null;

function genCode(){
  let s='';
  for(let i=0;i<4;i++) s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
function cleanup(){
  if(conn){try{conn.close();}catch(e){}}
  if(peer){try{peer.destroy();}catch(e){}}
  conn=null; peer=null; role=null; G=null; remoteState=null;
}

$('btnCreate').onclick = ()=>{
  show('host'); $('hostErr').textContent=''; $('hostStatus').textContent='正在创建房间…';
  const code = genCode();
  $('roomCode').textContent = code;
  try{ peer = new Peer('snakelink-'+code.toLowerCase(), {debug:0}); }
  catch(e){ $('hostErr').textContent='网络组件加载失败'; return; }
  peer.on('open', ()=> $('hostStatus').textContent='房间已就绪，等待对方加入…');
  peer.on('connection', c=>{
    conn = c;
    conn.on('open', ()=>{
      $('hostStatus').textContent='对方已加入，游戏开始！';
      startAsHost();
    });
    conn.on('data', d=>{ if(d && d.t==='dir') guestDir = d.d; });
    conn.on('close', ()=> onLeave('对方已离开'));
    conn.on('error', ()=> onLeave('连接断开'));
  });
  peer.on('error', err=>{
    if(err.type==='unavailable-id') $('hostErr').textContent='房间码被占用，刷新重试';
    else if(err.type==='network'||err.type==='server-unavailable') $('hostErr').textContent='联机服务器连接失败';
    else $('hostErr').textContent='错误：'+err.type;
  });
};
$('btnCancelHost').onclick = ()=>{ cleanup(); show('menu'); };

$('btnJoin').onclick = ()=>{ show('join'); $('codeInput').focus(); };
$('btnBack').onclick = ()=>{ cleanup(); show('menu'); };
$('btnDoJoin').onclick = ()=>{
  const code = $('codeInput').value.trim().toUpperCase();
  $('joinErr').textContent=''; $('joinStatus').textContent='正在连接…';
  if(code.length!==4){ $('joinErr').textContent='请输入 4 位房间码'; return; }
  try{ peer = new Peer({debug:0}); }
  catch(e){ $('joinErr').textContent='网络组件加载失败'; return; }
  peer.on('open', ()=>{
    conn = peer.connect('snakelink-'+code.toLowerCase(), {reliable:true});
    conn.on('open', ()=>{ $('joinStatus').textContent='已连接，等待房主开始…'; role='guest'; });
    conn.on('data', d=>{
      if(!d) return;
      if(d.t==='go') startAsGuest();
      else if(d.t==='s') remoteState = d;
      else if(d.t==='over') onGameOver(d.w);
      else if(d.t==='again') startAsHost();
    });
    conn.on('close', ()=> onLeave('房主已离开'));
    conn.on('error', ()=>{ $('joinErr').textContent='找不到该房间或连接失败'; });
  });
  peer.on('error', err=>{
    if(err.type==='peer-unavailable') $('joinErr').textContent='找不到该房间，请核对房间码';
    else $('joinErr').textContent='错误：'+err.type;
    $('joinStatus').textContent='';
  });
};
function onLeave(msg){ alert(msg); cleanup(); show('menu'); }

/* ===== 游戏逻辑（host 权威） ===== */
let G = null;
function newSnake(x,y,dx,dy){
  return {
    body:[{x:x,y:y},{x:x-dx,y:y-dy},{x:x-2*dx,y:y-2*dy}],
    dir:{x:dx,y:dy},
    score:0, dead:false
  };
}
function newGame(){
  G = {
    s1: newSnake(5, 12, 1, 0),
    s2: newSnake(GRID-6, 12, -1, 0),
    food: null,
    over:false, overSent:false, winner:null,
    tick: 0
  };
  placeFood();
}
function placeFood(){
  const occupied = new Set();
  for(const s of [G.s1,G.s2]) for(const p of s.body) occupied.add(p.x+','+p.y);
  let pos;
  do{ pos = {x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID)}; }
  while(occupied.has(pos.x+','+pos.y));
  G.food = pos;
}
function headHitBody(head, body, skipHead){
  for(let i=skipHead?1:0;i<body.length;i++) if(body[i].x===head.x && body[i].y===head.y) return true;
  return false;
}
function stepSnake(s, nd){
  // nd 是新方向，不能是当前方向的反向
  if(nd && !(nd.x===-s.dir.x && nd.y===-s.dir.y)) s.dir = nd;
  const nx = s.body[0].x + s.dir.x;
  const ny = s.body[0].y + s.dir.y;
  // 撞墙
  if(nx<0||nx>=GRID||ny<0||ny>=GRID) return true;
  // 撞自己（尾巴这一步会移开，所以不算最后一节，除非刚吃到食物）
  const willGrow = (G.food && nx===G.food.x && ny===G.food.y);
  const bodyToCheck = willGrow ? s.body : s.body.slice(0,-1);
  for(let i=0;i<bodyToCheck.length;i++) if(bodyToCheck[i].x===nx&&bodyToCheck[i].y===ny) return true;
  // 撞对方
  const other = s===G.s1 ? G.s2 : G.s1;
  for(let i=0;i<other.body.length;i++) if(other.body[i].x===nx&&other.body[i].y===ny) return true;
  // 移动
  s.body.unshift({x:nx,y:ny});
  if(willGrow){
    s.score++;
    placeFood();
    if(s.score>=WIN_SCORE){ G.over=true; G.winner = s===G.s1?0:1; }
  }else{
    s.body.pop();
  }
  return false;
}
let lastTick = 0;
function gameLoop(now){
  if(role==='host' && G && !G.over){
    if(now - lastTick >= TICK){
      lastTick = now;
      // 应用方向（host 本地方向来自 pendingDir.me，guest 来自 guestDir）
      if(pendingDir.me && !(pendingDir.me.x===-G.s1.dir.x && pendingDir.me.y===-G.s1.dir.y))
        G.s1.dir = pendingDir.me;
      if(guestDir && !(guestDir.x===-G.s2.dir.x && guestDir.y===-G.s2.dir.y))
        G.s2.dir = guestDir;
      pendingDir.me = null;
      const d1 = stepSnake(G.s1);
      const d2 = stepSnake(G.s2);
      if(d1 || d2){
        G.over = true;
        // 谁死了谁输；同死判分数高的赢
        if(d1 && d2) G.winner = G.s1.score>=G.s2.score?0:1;
        else if(d1) G.winner = 1;
        else G.winner = 0;
      }
    }
  }
}

/* ===== 开始/结束 ===== */
function startAsHost(){
  role='host'; newGame(); show('game');
  $('hudRole').textContent='你（青）'; $('hudOpp').textContent='对手（橙）';
  if(conn&&conn.open) conn.send({t:'go'});
}
function startAsGuest(){
  show('game');
  $('hudRole').textContent='你（橙）'; $('hudOpp').textContent='对手（青）';
}
function onGameOver(w){
  G=null; remoteState=null;
  const me = role==='host'?0:1;
  show('over');
  if(w===me){
    $('overTitle').textContent='胜 利';
    $('overTitle').style.color='#4ade80';
    $('overSub').textContent='你赢了这条蛇';
  }else{
    $('overTitle').textContent='败 北';
    $('overTitle').style.color='#f87171';
    $('overSub').textContent='下一局赢回来';
  }
}
$('btnAgain').onclick = ()=>{
  if(role==='host') startAsHost();
  else{ if(conn&&conn.open) conn.send({t:'again'}); show('game'); }
};
$('btnLeave').onclick = ()=>{ cleanup(); show('menu'); };

/* ===== 渲染 ===== */
function drawSnake(body, color){
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 8;
  for(let i=0;i<body.length;i++){
    const p = body[i];
    ctx.beginPath();
    ctx.roundRect(p.x*CELL+2, p.y*CELL+2, CELL-4, CELL-4, 5);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}
function render(){
  ctx.fillStyle='#0a0d1a'; ctx.fillRect(0,0,SIZE,SIZE);
  ctx.strokeStyle='rgba(60,80,140,.15)'; ctx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(SIZE,i*CELL); ctx.stroke();
  }
  let s1,s2,food,score;
  if(role==='host' && G){
    s1=G.s1; s2=G.s2; food=G.food;
    $('s1').textContent=G.s1.score; $('s2').textContent=G.s2.score;
  }else if(role==='guest' && remoteState){
    s1={body:remoteState.s1b, score:remoteState.s1s};
    s2={body:remoteState.s2b, score:remoteState.s2s};
    food=remoteState.food;
    $('s1').textContent=remoteState.s1s; $('s2').textContent=remoteState.s2s;
  }
  if(s1){
    drawSnake(s1.body, '#22d3ee');
    drawSnake(s2.body, '#fb923c');
  }
  if(food){
    ctx.fillStyle='#fde047';
    ctx.shadowColor='#fde047'; ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-6, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

/* ===== 主循环 + 网络同步 ===== */
let last=performance.now(), lastSend=0;
function loop(now){
  const dt = now-last; last=now;
  gameLoop(now);

  if(role==='host' && G){
    if(G.over && !G.overSent){
      G.overSent=true;
      if(conn&&conn.open) conn.send({t:'over', w:G.winner});
      onGameOver(G.winner);
    }
    if(conn && conn.open && now-lastSend>=100){
      lastSend=now;
      conn.send({
        t:'s',
        s1b:G.s1.body, s1s:G.s1.score,
        s2b:G.s2.body, s2s:G.s2.score,
        food:G.food
      });
    }
  }
  if(role==='guest' && conn && conn.open){
    // 发送本地方向
    if(pendingDir.me) conn.send({t:'dir', d:pendingDir.me});
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
